<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="app-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="app-electric-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="75%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#003d66"/>
    </linearGradient>
    <filter id="app-neon-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f0ff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ff00dc" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Solid full-bleed black base: zero transparent/white corners for app stores -->
  <rect width="512" height="512" fill="#000000"/>
  <rect width="512" height="512" fill="url(#app-bg-glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="114" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.25"/>

  <g transform="translate(256, 256) scale(2.55) translate(-100, -102)" filter="url(#app-neon-bloom)">
    <path
      d="
        M 46 56
        L 74 32
        L 74 132
        L 154 132
        L 154 160
        L 146 160
        L 146 172
        L 134 172
        L 134 160
        L 126 160
        L 126 172
        L 114 172
        L 114 160
        L 106 160
        L 106 172
        L 94 172
        L 94 160
        L 46 160
        Z
      "
      fill="url(#app-electric-flow)"
      stroke="#ff00dc"
      stroke-width="1.2"
      stroke-linejoin="miter"
    />
  </g>
</svg>