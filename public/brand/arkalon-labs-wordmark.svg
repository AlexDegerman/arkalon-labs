<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 60" width="100%" height="100%">
  <defs>
    <linearGradient id="wordmark-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="75%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#003d66"/>
    </linearGradient>
    <filter id="wordmark-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff00dc" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g fill="url(#wordmark-flow)" stroke="#ff00dc" stroke-width="0.5" filter="url(#wordmark-glow)">
    <text x="10" y="40" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="900" font-size="25" letter-spacing="4">ARKALON LABORATORIES</text>
  </g>
</svg>